<!DOCTYPE html>
<html>

<head>
    <title>Image Captioning + VQA</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 20px;
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        img {
            max-width: 100%;
            margin-top: 10px;
            display: none;
            border-radius: 8px;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }

        #output {
            margin-top: 15px;
            font-weight: bold;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Image Captioning + VQA</h2>

        <input type="file" id="imageInput" accept="image/*">
        <img id="preview">

        <button onclick="generateCaption()">Generate Caption</button>

        <input type="text" id="question" placeholder="Ask a question about the image">
        <button onclick="askQuestion()">Ask Question</button>

        <div id="output"></div>
    </div>

    <script>
        const preview = document.getElementById("preview");
        const output = document.getElementById("output");

        document.getElementById("imageInput").onchange = function (event) {
            const file = event.target.files[0];
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        };

        async function generateCaption() {
            const fileInput = document.getElementById("imageInput");

            if (!fileInput.files.length) {
                alert("Upload an image first");
                return;
            }

            output.innerText = "Generating caption...";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const res = await fetch("/caption", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (data.error) {
                    output.innerText = "Error: " + data.error;
                } else {
                    output.innerHTML = `
                        <b>English:</b> ${data.english}<br>
                        <b>Hindi:</b> ${data.hindi}<br>
                        <b>Malayalam:</b> ${data.malayalam}
                    `;
                }

            } catch (err) {
                output.innerText = "Server error";
            }
        }

        async function askQuestion() {
            const fileInput = document.getElementById("imageInput");
            const question = document.getElementById("question").value;

            if (!fileInput.files.length || !question) {
                alert("Upload image and enter question");
                return;
            }

            output.innerText = "Thinking...";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("question", question);

            try {
                const res = await fetch("/vqa", {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (data.error) {
                    output.innerText = "Error: " + data.error;
                } else {
                    output.innerHTML = `<b>Answer:</b> ${data.answer}`;
                }

            } catch (err) {
                output.innerText = "Server error";
            }
        }
    </script>

</body>

</html>
